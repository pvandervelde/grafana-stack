apiVersion: 1

deleteDatasources:
  - name: mimir

datasources:
- name: mimir
  type: prometheus
  access: proxy
  orgId: 1
  url: http://mimir-proxy:9009/prometheus
  basicAuth: false
  isDefault: false
  version: 1
  editable: true
  jsonData:
    # The recommended scrape interval is 60s.
    timeInterval: '60s'
  uid: mimir
- name: loki
  type: loki
  access: proxy
  orgId: 1
  url: http://loki-proxy:3100
  basicAuth: false
  isDefault: false
  version: 1
  editable: true
  jsonData:
    derivedFields:
      - datasourceUid: tempo
        matcherRegex: tid=(\w+)
        name: TraceID
        url: $${__value.raw}
  uid: loki
- name: tempo
  type: tempo
  access: proxy
  orgId: 1
  url: http://tempo-proxy:3200
  basicAuth: false
  isDefault: false
  version: 1
  editable: true
  apiVersion: 1
  uid: tempo
